name: Load Credit

on:
  schedule:
    # Cover both Israel UTC offsets; runtime guards enforce 09:00-18:00 local time.
    - cron: "*/5 6-15 * * 0-4"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read
  actions: read

# Prevent concurrent runs - only one token operation at a time
concurrency:
  group: token-operations
  cancel-in-progress: false

env:
  TZ: Asia/Jerusalem
  # Already loaded manually on the rollout day. Future manual loads can be excluded via the repository variable.
  CREDIT_SKIP_DATES: "2026-11-02,${{ vars.CREDIT_SKIP_DATES }}"

jobs:
  check-daily-load:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    outputs:
      should_load: ${{ steps.guard.outputs.should_load }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for an earlier loading attempt
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const { guardCreditRun } = require('./.github/scripts/credit-run-guard');
            const shouldLoad = await guardCreditRun({ github, context, core });
            core.setOutput('should_load', String(shouldLoad));

  load-credit:
    needs: check-daily-load
    if: needs.check-daily-load.outputs.should_load == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Refresh tokens before credit loading
        id: refresh
        run: node github-refresh-token.js
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          AMOUNT: ${{ secrets.AMOUNT }}
          MONEYCARD_ID: ${{ secrets.MONEYCARD_ID }}

      - name: Update GitHub secrets with fresh tokens
        if: steps.refresh.outputs.tokens_updated == 'true'
        uses: actions/github-script@v7
        env:
          NEW_ACCESS_TOKEN: ${{ steps.refresh.outputs.access_token }}
          NEW_REFRESH_TOKEN: ${{ steps.refresh.outputs.refresh_token }}
        with:
          github-token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          script: |
            const sodium = require('libsodium-wrappers');
            await sodium.ready;

            // Get repository public key
            const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Encrypt and update ACCESS_TOKEN if provided
            if (process.env.NEW_ACCESS_TOKEN) {
              const accessTokenBytes = Buffer.from(process.env.NEW_ACCESS_TOKEN);
              const publicKeyBytes = Buffer.from(publicKey.key, 'base64');
              const accessTokenEncrypted = sodium.crypto_box_seal(accessTokenBytes, publicKeyBytes);

              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: 'ACCESS_TOKEN',
                encrypted_value: Buffer.from(accessTokenEncrypted).toString('base64'),
                key_id: publicKey.key_id,
              });
              console.log('ACCESS_TOKEN updated');
            }

            // Encrypt and update REFRESH_TOKEN if provided
            if (process.env.NEW_REFRESH_TOKEN) {
              const refreshTokenBytes = Buffer.from(process.env.NEW_REFRESH_TOKEN);
              const publicKeyBytes = Buffer.from(publicKey.key, 'base64');
              const refreshTokenEncrypted = sodium.crypto_box_seal(refreshTokenBytes, publicKeyBytes);

              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: 'REFRESH_TOKEN',
                encrypted_value: Buffer.from(refreshTokenEncrypted).toString('base64'),
                key_id: publicKey.key_id,
              });
              console.log('REFRESH_TOKEN updated');
            }

            console.log('Secrets updated successfully');

      - name: Run credit loading with fresh tokens
        id: load-credit
        run: node github-load-credit.js
        env:
          ACCESS_TOKEN: ${{ steps.refresh.outputs.access_token || secrets.ACCESS_TOKEN }}
          REFRESH_TOKEN: ${{ steps.refresh.outputs.refresh_token || secrets.REFRESH_TOKEN }}
          AMOUNT: ${{ secrets.AMOUNT }}
          MONEYCARD_ID: ${{ secrets.MONEYCARD_ID }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
